[project]
name = "riftbound-sim"
version = "0.1.0"
description = "Headless deterministic Riftbound rules engine and simulation harness"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=6"]  # pypdf is data-prep only; nothing in engine/ or cards/ imports it

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

markers = ["perf: performance budget checks"]

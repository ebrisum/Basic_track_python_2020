# The settings a normal run uses. Every key here is also in
# `learning/config.py::DEFAULTS`; this file exists so the defaults are
# readable without opening Python, and so a change can be reviewed as a diff.
#
# Precedence: built-in defaults < this file < command-line flags.

[run]
games = 100
seed0 = 0
action_cap = 3000     # a game past this is reported unresolved, never truncated silently
progress = 25
workers = 1           # section 13's worker pool does not exist yet; >1 is not honoured

[game]
decks = ["jinx_chaos_fury", "volibear_body_fury"]
agents = ["random", "greedy"]

[model]
# Section 17's example defaults. Vocabulary sizes are NOT here: they come from
# the state encoder's actual widths, so a card pool that grows cannot leave a
# stale number in a config file.
embedding_dim = 128
transformer_layers = 4
attention_heads = 4
ff_dim = 512
dropout = 0.0

[ppo]
# Section 22's defaults, treated as defaults.
learning_rate = 0.0003
gamma = 1.0            # terminal reward only; discounting a win by its length would be shaping
gae_lambda = 0.95
clip_range = 0.2
entropy_coef = 0.01
value_coef = 0.5
max_grad_norm = 0.5

[reward]
# Section 15. Setting this true raises -- see learning/config.py.
shaping = false

[curriculum]
level = 0             # 0 is the full game; section 26's levels are not built

[evaluation]
scenarios = true
interval_games = 1000

[league]
checkpoint_interval = 1
sampling = "uniform"

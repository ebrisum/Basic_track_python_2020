# Small and loud: for checking a change runs at all, not for measuring anything.
# Numbers this small are statistically meaningless by design -- a 5-game
# result is noise, and reporting one as a finding is the mistake this file
# should not encourage.

[run]
games = 5
progress = 1
action_cap = 400

[game]
agents = ["random", "random"]

[model]
# Tiny enough that a forward pass is instant and a shape bug is obvious.
embedding_dim = 32
transformer_layers = 2
attention_heads = 2
ff_dim = 64
